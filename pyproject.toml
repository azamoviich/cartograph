[project]
name = "cartograph"
version = "0.1.0"
description = "Auto-generated architecture docs for any repo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "networkx>=3.3",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
    "click>=8.1",
    "pydantic>=2.9",
    "anthropic>=0.40",
    "json5>=0.15.0",
]

[project.scripts]
cartograph = "cartograph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartograph"]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/fixtures", "tests/fixtures_js", "tests/fixtures_src_layout"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6",
]
